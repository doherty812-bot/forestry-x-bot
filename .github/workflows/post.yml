name: 林業X下書き生成

# 人間承認制: schedule / 手動とも「下書き生成のみ」。X には投稿しない。
# 投稿の主経路は別 workflow「林業X承認投稿」（approve.yml）。
# Enable 済みでも誤爆しないよう、この workflow に X_* Secrets を渡さない。
on:
  schedule:
    # 昼12時 JST = UTC 03:00 — 下書き生成
    - cron: '0 3 * * *'
    # 夜20時 JST = UTC 11:00 — 下書き生成
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: '下書きスロット（12:00 / 20:00）'
        required: false
        default: '12:00'

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python 3.11 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存パッケージをインストール
        run: |
          pip install -r requirements.txt

      - name: 下書きを生成（投稿しない）
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # 空の Secret が渡ると SDK が壊れるため、未使用時は変数自体を渡さない方針。
          # 互換 URL が必要なときだけ OPENAI_BASE_URL Secret を設定する。
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          # Obsidian: パスは Variables / Secrets で後から設定。未設定なら ./obsidian を探し、無ければ警告して続行
          OBSIDIAN_VAULT_PATH: ${{ vars.OBSIDIAN_VAULT_PATH }}
          OBSIDIAN_SYNC_PATH: ${{ vars.OBSIDIAN_SYNC_PATH }}
          OBSIDIAN_MISSING_POLICY: ${{ vars.OBSIDIAN_MISSING_POLICY }}
        run: |
          # モデル名: Secret が空文字のときはコード側既定値を使うため、空なら unset
          if [ -n "${{ secrets.OPENAI_MODEL }}" ]; then
            export OPENAI_MODEL="${{ secrets.OPENAI_MODEL }}"
          fi
          if [ -n "${{ secrets.GROK_MODEL }}" ]; then
            export GROK_MODEL="${{ secrets.GROK_MODEL }}"
          fi
          if [ -n "${{ secrets.XAI_BASE_URL }}" ]; then
            export XAI_BASE_URL="${{ secrets.XAI_BASE_URL }}"
          fi
          # 空の OPENAI_BASE_URL は unset（公式エンドポイントへ）
          if [ -z "${OPENAI_BASE_URL}" ]; then
            unset OPENAI_BASE_URL
          fi
          if [ -z "${OBSIDIAN_VAULT_PATH}" ]; then
            unset OBSIDIAN_VAULT_PATH
          fi
          if [ -z "${OBSIDIAN_SYNC_PATH}" ]; then
            unset OBSIDIAN_SYNC_PATH
          fi
          if [ -z "${OBSIDIAN_MISSING_POLICY}" ]; then
            export OBSIDIAN_MISSING_POLICY=warn
          fi
          if [ -z "${XAI_API_KEY}" ] && [ -z "${GROK_API_KEY}" ]; then
            echo "XAI_API_KEY または GROK_API_KEY が未設定です" >&2
            exit 1
          fi
          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "OPENAI_API_KEY が未設定です" >&2
            exit 1
          fi
          if [ -n "${{ github.event.inputs.slot }}" ]; then
            SLOT="${{ github.event.inputs.slot }}"
          else
            UTC_HOUR=$(date -u +%H)
            case $UTC_HOUR in
              03) SLOT="12:00" ;;
              11) SLOT="20:00" ;;
              *) SLOT="12:00" ;;
            esac
          fi
          echo "下書きスロット: $SLOT（X投稿は行いません）"
          echo "OPENAI_MODEL=${OPENAI_MODEL:-<code-default>}"
          echo "GROK_MODEL=${GROK_MODEL:-<code-default>}"
          echo "OBSIDIAN_VAULT_PATH=${OBSIDIAN_VAULT_PATH:-<unset>}"
          echo "OBSIDIAN_MISSING_POLICY=${OBSIDIAN_MISSING_POLICY}"
          python forestry_bot.py draft "$SLOT"

      - name: 下書きアーティファクトを保存
        uses: actions/upload-artifact@v4
        with:
          name: forestry-drafts
          path: drafts/*.json
          if-no-files-found: warn

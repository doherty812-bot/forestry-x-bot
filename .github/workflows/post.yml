name: 林業X自動投稿

# 引継ぎ中は workflow 自体を GitHub UI で Disable 済みであること。
# 再開までは schedule を置かず、手動 workflow_dispatch のみ残す。
on:
  workflow_dispatch:
    inputs:
      slot:
        description: '投稿スロット（12:00 / 20:00）'
        required: false
        default: ''
      confirm_live_post:
        description: '実投稿する場合は true（CONFIRM_LIVE_POST=1）'
        required: true
        type: boolean
        default: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python 3.11 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存パッケージをインストール
        run: |
          pip install -r requirements.txt

      - name: 投稿スロットを判定して実行
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          CONFIRM_LIVE_POST: ${{ inputs.confirm_live_post && '1' || '0' }}
        run: |
          if [ "${CONFIRM_LIVE_POST}" != "1" ]; then
            echo "実投稿が無効です。confirm_live_post=true で再実行してください。"
            exit 1
          fi
          # 手動実行でスロット指定がある場合はそれを使う
          if [ -n "${{ github.event.inputs.slot }}" ]; then
            SLOT="${{ github.event.inputs.slot }}"
          else
            # UTC時刻からJSTスロットを判定（再開後の schedule 復帰用ロジック）
            UTC_HOUR=$(date -u +%H)
            case $UTC_HOUR in
              03) SLOT="12:00" ;;
              11) SLOT="20:00" ;;
              *) SLOT="12:00" ;;
            esac
          fi
          echo "実行スロット: $SLOT"
          python forestry_bot.py "$SLOT"
